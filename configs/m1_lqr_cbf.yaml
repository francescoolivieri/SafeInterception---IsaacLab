# M1: LQR pursuit with evader-velocity feedforward, filtered by a first-order CBF-QP.
# Thesis settings: q 4, r 1, d_safe 0.32 m, alpha 1.5 1/s.
# The suite follows the task (large arena, in distribution); scripts/evaluate.py --ood-room
# reruns it in the room (thesis: 200 envs there).
name: m1_lqr_cbf
task: TargetInterception-State-Large-v0
num_envs: 256
env_overrides: {}

policy:
  type: classical
  params:
    q: 4.0
    r: 1.0

filter:
  type: cbf_qp
  params:
    d_safe: 0.32
    alpha: 1.5

output_dir: outputs/benchmark/m1_lqr_cbf
