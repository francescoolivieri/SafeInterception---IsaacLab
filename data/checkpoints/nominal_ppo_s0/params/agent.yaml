seed: 0
models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 512
      - 256
      - 256
      - 128
      activations: elu
    output: tanh(ACTIONS)
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 512
      - 256
      - 256
      - 128
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 48
  learning_epochs: 4
  mini_batches: 10
  discount_factor: 0.995
  gae_lambda: 0.95
  learning_rate: 0.0002
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.004
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.003
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: false
  experiment:
    directory: logs/projects/target_interception/nominal_large_ppo_tanh_s0
    experiment_name: 2026-11-02_23-17-55
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: target_interception
      entity: ''
      name: nominal-large-tanh-s0
      sync_tensorboard: false
      dir: logs/projects/target_interception/nominal_large_ppo_tanh_s0/2026-11-02_23-17-55
      config:
        task: TargetInterception-Nominal-Large-v0
        algorithm: ppo
        seed: 0
        num_envs: 4096
        total_frames: 614400000
        scenario_pool: clutter_nominal_pool_large
trainer:
  class: SequentialTrainer
  timesteps: 150000
  environment_info: log
  close_environment_at_exit: false
